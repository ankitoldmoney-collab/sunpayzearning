    <!-- Meta Pixel Code -->

    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',

    <script>
        tailwind.config = {

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #080a0f;
            background-image: 
                radial-gradient(ellipse at 50% 30%, rgba(245, 158, 11, 0.15) 0%, transparent 70%),
                radial-gradient(ellipse at 50% 80%, rgba(34, 158, 217, 0.1) 0%, transparent 70%);
        }
        
        .square-box {
            background: linear-gradient(145deg, #131926, #0e121b);
            border: 1px solid rgba(245, 158, 11, 0.25);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(245, 158, 11, 0.15);
        }

        .pulse-effect {
            animation: pulse-glow 2s infinite;
        }

        @keyframes pulse-glow {
            0%, 100% {
                box-shadow: 0 0 15px rgba(34, 158, 217, 0.5);
                transform: scale(1);
            }
            50% {
                box-shadow: 0 0 30px rgba(34, 158, 217, 0.9);
                transform: scale(1.02);
            }
        }

        .progress-ring-circle {
            transition: stroke-dashoffset 0.35s linear;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }

        .dark-shadow-title {
            text-shadow: 0 4px 12px rgba(0, 0, 0, 0.9), 0 2px 4px rgba(0, 0, 0, 0.8);
        }
    </style>
</head>
<body class="min-h-screen w-full flex items-center justify-center p-4">

    <main class="w-full max-w-sm square-box rounded-3xl p-6 sm:p-8 text-center flex flex-col items-center justify-center transition-all duration-300 relative overflow-hidden">
        
        <!-- Anti-Invalid Click Status Header -->
        <div id="bot-status-badge" class="mb-4 inline-flex items-center gap-2 px-3 py-1 rounded-full bg-amber-500/10 border border-amber-500/30 text-amber-400 text-xs font-bold tracking-wide">
            <i class="fa-solid fa-shield-halved text-amber-400"></i>
            <span id="status-text">Verifying visitor safety...</span>
        </div>

        <!-- SUNPAYZ Logo Artwork -->
        <div class="relative w-44 h-44 sm:w-48 sm:h-48 mb-4 rounded-2xl overflow-hidden border-2 border-amber-400/50 shadow-2xl bg-black flex items-center justify-center p-2">
            <svg viewBox="0 0 500 500" class="w-full h-full rounded-xl">
                <defs>
                    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#FFE066"/>
                        <stop offset="50%" stop-color="#F59E0B"/>
                        <stop offset="100%" stop-color="#B45309"/>
                    </linearGradient>
                    <linearGradient id="redRibbon" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#DC2626"/>
                        <stop offset="100%" stop-color="#991B1B"/>
                    </linearGradient>
                    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur stdDeviation="8" result="blur" />
                        <feComposite in="SourceGraphic" in2="blur" operator="over" />
                    </filter>
                </defs>

                <!-- Background Circle -->
                <circle cx="250" cy="250" r="235" fill="#0A0A0A" />
                <circle cx="250" cy="250" r="225" fill="none" stroke="url(#goldGrad)" stroke-width="14" filter="url(#glow)" />
                <circle cx="250" cy="250" r="210" fill="none" stroke="#FBBF24" stroke-width="3" stroke-dasharray="8 6"/>

                <!-- Crown & Decorative Elements -->
                <path d="M 180 120 L 210 160 L 250 100 L 290 160 L 320 120 L 310 180 L 190 180 Z" fill="url(#goldGrad)" />
                <circle cx="180" cy="115" r="8" fill="#FFF" />
                <circle cx="250" cy="95" r="10" fill="#FFF" />
                <circle cx="320" cy="115" r="8" fill="#FFF" />
                
                <circle cx="130" cy="380" r="30" fill="url(#goldGrad)" />
                <text x="130" y="390" font-family="sans-serif" font-weight="900" font-size="32" fill="#78350F" text-anchor="middle">₹</text>
                
                <circle cx="370" cy="380" r="30" fill="url(#goldGrad)" />
                <text x="370" y="390" font-family="sans-serif" font-weight="900" font-size="32" fill="#78350F" text-anchor="middle">₹</text>

                <!-- Branding Typography -->
                <text x="250" y="230" font-family="Plus Jakarta Sans, sans-serif" font-weight="900" font-size="85" fill="url(#goldGrad)" text-anchor="middle" stroke="#000" stroke-width="12" paint-order="stroke fill">SUN</text>
                
                <rect x="80" y="245" width="340" height="75" rx="15" fill="#FFFFFF" stroke="#000" stroke-width="8" />
                <text x="250" y="305" font-family="Plus Jakarta Sans, sans-serif" font-weight="900" font-size="62" fill="#0F172A" text-anchor="middle">PAYZ</text>

                <path d="M 120 320 L 380 320 L 360 380 L 140 380 Z" fill="url(#redRibbon)" stroke="#000" stroke-width="6" />
                <text x="250" y="368" font-family="Plus Jakarta Sans, sans-serif" font-weight="900" font-size="42" fill="#FFFFFF" text-anchor="middle">EARNING</text>
                
                <circle cx="250" cy="420" r="40" fill="url(#goldGrad)" stroke="#000" stroke-width="6" />
                <text x="250" y="435" font-family="sans-serif" font-weight="900" font-size="45" fill="#78350F" text-anchor="middle">₹</text>
            </svg>
        </div>

        <!-- Title Section -->
        <div class="mb-4">
            <h1 class="text-2xl sm:text-3xl font-black text-white tracking-wider uppercase dark-shadow-title">
                SUN<span class="text-amber-400">PAYZ</span>
            </h1>
            <p class="text-xs text-amber-300/80 font-bold tracking-widest mt-1 uppercase">
                EARNING CENTER
            </p>
        </div>

        <!-- 6-Second Auto Redirect Progress Container -->
        <div class="w-full bg-slate-900/80 rounded-2xl p-3 border border-slate-800 mb-5 flex items-center justify-between">
            <div class="text-left pl-2">
                <p class="text-[11px] text-slate-400 font-semibold uppercase tracking-wider">Auto Redirecting</p>
                <p id="countdown-label" class="text-xs text-amber-400 font-bold">In 6 Seconds...</p>
            </div>
            
            <div class="relative w-10 h-10 flex items-center justify-center">
                <svg class="w-10 h-10">
                    <circle class="text-slate-800" stroke-width="3" stroke="currentColor" fill="transparent" r="16" cx="20" cy="20"/>
                    <circle id="progress-circle" class="text-amber-400 progress-ring-circle" stroke-width="3" stroke-dasharray="100" stroke-dashoffset="0" stroke-linecap="round" stroke="currentColor" fill="transparent" r="16" cx="20" cy="20"/>
                </svg>
                <span id="timer-number" class="absolute text-xs font-black text-white">6</span>
            </div>
        </div>

        <!-- Join Telegram CTA Button -->
        <button 
            id="tg-join-btn"
            onclick="handleUserManualClick(event)"
            class="w-full py-4 px-6 rounded-2xl font-black text-white bg-telegram hover:bg-telegramHover active:scale-95 transition-all duration-200 flex items-center justify-center gap-3 text-lg shadow-lg pulse-effect group cursor-pointer"
        >
            <i class="fa-brands fa-telegram text-2xl group-hover:scale-110 transition-transform"></i>
            <span id="btn-text">JOIN TELEGRAM</span>
        </button>

        <p class="text-[10px] text-slate-500 mt-3 flex items-center justify-center gap-1">
            <i class="fa-solid fa-shield-cat text-[9px]"></i> Protected Anti-Bot Redirect System
        </p>

    </main>

    <script>
        // Updated Telegram Target Link
        const TELEGRAM_URL = "https://t.me/+gR4L5jN5bodhZmZl";
        
        let timeLeft = 6;
        const totalTime = 6;
        let isHumanVerified = false;
        let isClickDebounced = false;
        let redirectTimer = null;

        const timerNum = document.getElementById('timer-number');
        const countdownLabel = document.getElementById('countdown-label');
        const progressCircle = document.getElementById('progress-circle');
        const statusBadge = document.getElementById('bot-status-badge');
        const statusText = document.getElementById('status-text');

        // Circular stroke math setup
        const circumference = 2 * Math.PI * 16;
        progressCircle.style.strokeDasharray = `${circumference} ${circumference}`;

        function updateProgress(time) {
            const offset = circumference - (time / totalTime) * circumference;
            progressCircle.style.strokeDashoffset = offset;
        }

        // Anti-Bot Script Check
        function performBotCheck() {
            const isHeadless = navigator.webdriver || 
                                !navigator.languages || 
                                navigator.languages.length === 0 || 
                                /HeadlessChrome|PhantomJS|Selenium/i.test(navigator.userAgent);

            if (isHeadless) {
                statusBadge.className = "mb-4 inline-flex items-center gap-2 px-3 py-1 rounded-full bg-red-500/10 border border-red-500/30 text-red-400 text-xs font-bold tracking-wide";
                statusText.innerText = "Automated Bot Detected";
                return false;
            }

            isHumanVerified = true;
            statusBadge.className = "mb-4 inline-flex items-center gap-2 px-3 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs font-bold tracking-wide";
            statusText.innerText = "Real Visitor Verified";
            return true;
        }

        // Auto-redirect process
        function executeAutoRedirect() {
            if (isClickDebounced) return;
            isClickDebounced = true;

            const btnText = document.getElementById('btn-text');
            btnText.innerText = "REDIRECTING...";

            window.location.href = TELEGRAM_URL;
        }

        // Countdown timer initialization
        function startCountdown() {
            updateProgress(timeLeft);

            redirectTimer = setInterval(() => {
                timeLeft--;
                timerNum.innerText = timeLeft;
                countdownLabel.innerText = `In ${timeLeft} Second${timeLeft === 1 ? '' : 's'}...`;
                updateProgress(timeLeft);

                if (timeLeft <= 0) {
                    clearInterval(redirectTimer);
                    executeAutoRedirect();
                }
            }, 1000);
        }

        // Manual button click handler (FIRES META LEAD EVENT)
        function handleUserManualClick(e) {
            if (e) e.preventDefault();

            if (isClickDebounced) return;
            
            if (!isHumanVerified) {
                if (!performBotCheck()) {
                    alert("Automated access blocked.");
                    return;
                }
            }

            isClickDebounced = true;
            clearInterval(redirectTimer);

            const btnText = document.getElementById('btn-text');
            btnText.innerText = "JOINING...";

            // FIRE META LEAD EVENT FOR PIXEL 1147098971090840 ONLY ON REAL HUMAN CLICK
            if (typeof fbq === 'function') {
                try {
                    fbq('track', 'Lead');
                } catch (err) {
                    console.log('Pixel Lead event error:', err);
                }
            }

            // Redirect after brief delay to allow pixel ping to fire
            setTimeout(() => {
                window.location.href = TELEGRAM_URL;
            }, 150);
        }

        // Initialize security check & start timer
        window.addEventListener('DOMContentLoaded', () => {
            const isValid = performBotCheck();
            if (isValid) {
                startCountdown();
            }
        });

        // Event listeners to confirm human activity
        const humanEvents = ['mousemove', 'touchstart', 'keydown', 'scroll'];
        function onHumanActivity() {
            if (!isHumanVerified) {
                performBotCheck();
            }
            humanEvents.forEach(evt => window.removeEventListener(evt, onHumanActivity));
        }
        humanEvents.forEach(evt => window.addEventListener(evt, onHumanActivity, { passive: true }));
    </script>
</body>
</html>
